<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#38bdf8;#818cf8;#ec4899" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="glowLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseBeam {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatPill {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes rotateRing {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .beam-line {
        stroke-dasharray: 12 12;
        animation: pulseBeam 4s linear infinite;
      }
      .floating-card-1 {
        animation: floatPill 5s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatPill 6s ease-in-out 1s infinite;
      }
      .floating-card-3 {
        animation: floatPill 5.5s ease-in-out 2s infinite;
      }
      .rotating-gear {
        transform-origin: 600px 315px;
        animation: rotateRing 20s linear infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="400" rx="18" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Animated Tech Ambient Grid Lines -->
  <g opacity="0.15">
    <line x1="0" y1="80" x2="1200" y2="80" stroke="#38bdf8" stroke-width="1" />
    <line x1="0" y1="160" x2="1200" y2="160" stroke="#38bdf8" stroke-width="1" />
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#38bdf8" stroke-width="1" />
    <line x1="0" y1="320" x2="1200" y2="320" stroke="#38bdf8" stroke-width="1" />
    <line x1="200" y1="0" x2="200" y2="400" stroke="#38bdf8" stroke-width="1" />
    <line x1="400" y1="0" x2="400" y2="400" stroke="#38bdf8" stroke-width="1" />
    <line x1="600" y1="0" x2="600" y2="400" stroke="#38bdf8" stroke-width="1" />
    <line x1="800" y1="0" x2="800" y2="400" stroke="#38bdf8" stroke-width="1" />
    <line x1="1000" y1="0" x2="1000" y2="400" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="80" r="130" fill="#38bdf8" opacity="0.08" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.05;0.12;0.05" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="320" r="140" fill="#ec4899" opacity="0.08" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.06;0.14;0.06" dur="7s" repeatCount="indefinite" />
  </circle>
  <circle cx="600" cy="315" r="90" fill="#6366f1" opacity="0.12" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Background Animated Converter Pipeline (Positioned in Bottom Section to Avoid Text) -->
  <g id="converter-pipeline" transform="translate(0, 0)">
    <!-- Connection Beam Track -->
    <path d="M 230 315 L 540 315" stroke="#1e293b" stroke-width="3" />
    <path d="M 660 315 L 970 315" stroke="#1e293b" stroke-width="3" />

    <!-- Animated Laser Flow -->
    <path d="M 230 315 L 540 315" stroke="#38bdf8" stroke-width="3" class="beam-line" filter="url(#glow)" />
    <path d="M 660 315 L 970 315" stroke="#ec4899" stroke-width="3" class="beam-line" filter="url(#glow)" />

    <!-- Left Node: PostScript / EPS Input -->
    <g class="floating-card-1">
      <rect x="130" y="285" width="130" height="60" rx="12" fill="url(#cardGrad)" stroke="#0ea5e9" stroke-width="1.5" />
      <circle cx="155" cy="315" r="14" fill="#0284c7" />
      <text x="155" y="320" font-family="sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle">PS</text>
      <text x="180" y="310" class="badge-text" fill="#f8fafc">PostScript</text>
      <text x="180" y="328" font-family="sans-serif" font-weight="500" font-size="11" fill="#94a3b8">.ps / .eps</text>
    </g>

    <!-- Center Node: Ghostscript / Distiller Engine Core -->
    <g>
      <!-- Rotating Orbit Ring -->
      <circle cx="600" cy="315" r="42" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 8" class="rotating-gear" opacity="0.7" />
      <circle cx="600" cy="315" r="32" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" filter="url(#glow)" />
      <!-- Engine Icon (Process Arrows) -->
      <path d="M 590 310 L 610 310 M 603 304 L 610 310 L 603 316" stroke="#c7d2fe" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 610 320 L 590 320 M 597 326 L 590 320 L 597 314" stroke="#c7d2fe" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="600" y="372" class="badge-text" fill="#a5b4fc" text-anchor="middle">Ghostscript &amp; Distiller</text>
    </g>

    <!-- Right Node: PDF Output -->
    <g class="floating-card-3">
      <rect x="940" y="285" width="130" height="60" rx="12" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1.5" />
      <circle cx="965" cy="315" r="14" fill="#e11d48" />
      <text x="965" y="320" font-family="sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">PDF</text>
      <text x="990" y="310" class="badge-text" fill="#f8fafc">Vector PDF</text>
      <text x="990" y="328" font-family="sans-serif" font-weight="500" font-size="11" fill="#f472b6">PDF/X • PDF/A</text>
    </g>
  </g>

  <!-- Foreground Title and Subtitle (Always crisp, prominent, on top, no overlap) -->
  <g id="foreground-text">
    <!-- Tag Pill -->
    <g transform="translate(485, 42)">
      <rect x="0" y="0" width="230" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="16" cy="15" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="30" y="20" class="badge-text" fill="#cbd5e1">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title with Gradient Glow -->
    <text x="600" y="125" text-anchor="middle" class="title-text" fill="url(#textGrad)" filter="url(#glow)">
      Awesome PostScript To PDF Converter
    </text>
    <!-- Crisp Foreground Layer for Title -->
    <text x="600" y="125" text-anchor="middle" class="title-text" fill="#ffffff">
      Awesome PostScript To PDF Converter
    </text>

    <!-- Subtitle -->
    <text x="600" y="165" text-anchor="middle" class="subtitle-text" fill="#94a3b8">
      Top SaaS Platforms, Ghostscript Batch Pipelines, Distiller Compatibility &amp; Open-Source Tools
    </text>

    <!-- Feature Highlights / Pills Row (Positioned well above the pipeline and below subtitle) -->
    <g transform="translate(0, 195)">
      <!-- Pill 1: Ghostscript 10 -->
      <g transform="translate(190, 0)" class="floating-card-1">
        <rect x="0" y="0" width="175" height="32" rx="16" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" />
        <text x="87" y="21" class="badge-text" fill="#38bdf8" text-anchor="middle">⚡ Ghostscript 10.08</text>
      </g>

      <!-- Pill 2: Distiller Presets -->
      <g transform="translate(390, 0)" class="floating-card-2">
        <rect x="0" y="0" width="195" height="32" rx="16" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2" />
        <text x="97" y="21" class="badge-text" fill="#c084fc" text-anchor="middle">🎛️ Distiller Compatibility</text>
      </g>

      <!-- Pill 3: Batch CLI Automation -->
      <g transform="translate(610, 0)" class="floating-card-1">
        <rect x="0" y="0" width="180" height="32" rx="16" fill="#0f172a" stroke="#ec4899" stroke-width="1.2" />
        <text x="90" y="21" class="badge-text" fill="#f472b6" text-anchor="middle">⚙️ Batch CLI Pipelines</text>
      </g>

      <!-- Pill 4: Prepress & Archival -->
      <g transform="translate(815, 0)" class="floating-card-3">
        <rect x="0" y="0" width="195" height="32" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
        <text x="97" y="21" class="badge-text" fill="#34d399" text-anchor="middle">🖨️ PDF/X &amp; PDF/A Ready</text>
      </g>
    </g>
  </g>
</svg>
